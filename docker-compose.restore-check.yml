# Separate network and temporary database; never attaches the application volume.
name: printer-inventory-restore-check
services:
  restore-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory_restore_check
      POSTGRES_USER: restore_check
      POSTGRES_PASSWORD: disposable_restore_only
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_check -d inventory_restore_check"]
      interval: 2s
      timeout: 3s
      retries: 20
  restore-check:
    image: postgres:17-alpine
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PGHOST: restore-db
      PGDATABASE: inventory_restore_check
      PGUSER: restore_check
      PGPASSWORD: disposable_restore_only
      PGCONNECT_TIMEOUT: 5
      BACKUP_FILE: ${BACKUP_FILE:?Set BACKUP_FILE to the filename of a backup in backups/}
    volumes:
      - ./backups:/backups:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/restore-check.sh"]
    depends_on:
      restore-db:
        condition: service_healthy
