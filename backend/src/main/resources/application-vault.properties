# Vault mode is activated explicitly by docker-compose.app-server-vault.yml.
# Import only the Printer Inventory database secret from the applications KV v2 mount.
spring.config.import=vault:///printer-inventory/database
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=${VAULT_ADDR:http://central-vault:8200}
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=applications
spring.cloud.vault.kv.backend-version=2
spring.cloud.vault.connection-timeout=5000
spring.cloud.vault.read-timeout=15000
spring.cloud.vault.fail-fast=true
