spring.application.name=printer-inventory
app.time-zone=${APP_TIME_ZONE:Asia/Manila}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/printer_inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:printerapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=3

# Flyway applies versioned SQL; Hibernate only verifies the resulting schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Server-side authentication session. Enable Secure cookies when served over HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Optional one-time bootstrap account. All three values must be supplied together.
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.initial-admin.full-name=${INITIAL_ADMIN_FULL_NAME:}
