spring.application.name=printer-inventory
app.time-zone=${APP_TIME_ZONE:Asia/Manila}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/printer_inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:printerapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=3

# Flyway applies versioned SQL; Hibernate only verifies the resulting schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
