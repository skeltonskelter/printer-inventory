name: printer-inventory

services:
  backend:
    image: printer-inventory-backend:${APP_VERSION:-local}
    build: ./backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: vault
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.197.20:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}

      VAULT_ADDR: ${VAULT_ADDR:-http://central-vault:8200}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?Set VAULT_ROLE_ID in the ignored deployment environment}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?Set VAULT_SECRET_ID in the ignored deployment environment}

      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Manila}

      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME:-}

      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError"

    networks:
      - default
      - vault-applications

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/health"
        ]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: printer-inventory-frontend:${APP_VERSION:-local}
    build: ./frontend
    restart: unless-stopped

    ports:
      - "${APP_BIND_ADDRESS:-10.10.30.182}:${APP_PORT:-80}:8080"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - default

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vault-applications:
    external: true
    name: central-vault-applications
